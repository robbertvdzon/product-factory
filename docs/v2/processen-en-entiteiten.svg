<svg xmlns="http://www.w3.org/2000/svg" width="2420" height="1540" viewBox="0 0 2420 1540" role="img" aria-labelledby="title desc">
  <title id="title">Product Factory v2 modulecontracten</title>
  <desc id="desc">UML-achtig modulecontractdiagram. Ieder moduleblok toont bovenaan de publieke functies en daaronder de publieke entiteiten waarvan de module eigenaar is. Doorgetrokken pijlen zijn commands, gestippelde pijlen zijn read-only queries. Queuecommands starten geen agents. De Stakeholder is een actor. Scheduler en frontend zijn niet afgebeeld.</desc>
  <defs>
    <marker id="commandArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/>
    </marker>
    <marker id="queryArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #475569; }
      .module-title { font: 700 24px Inter, Arial, sans-serif; fill: #0f172a; }
      .section-title { font: 700 13px Inter, Arial, sans-serif; letter-spacing: 1px; fill: #64748b; }
      .api { font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #172033; }
      .entity { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #172033; }
      .note { font: 400 14px Inter, Arial, sans-serif; fill: #64748b; }
      .flow { font: 600 13px Inter, Arial, sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .command { fill: none; stroke: #0f172a; stroke-width: 2.8; marker-end: url(#commandArrow); }
      .query { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#queryArrow); }
      .divider { stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="2420" height="1540" fill="#f8fafc"/>
  <text x="55" y="55" class="title">Product Factory v2 — publieke modulecontracten en eigenaarschap</text>
  <text x="55" y="88" class="subtitle">Boven de scheidslijn staat wat andere onderdelen mogen aanroepen; daaronder staan uitsluitend de eigen publieke entiteiten.</text>
  <path d="M65 125 H155" class="command"/>
  <text x="170" y="130" class="note">command: vraagt de eigenaar om een geldige wijziging</text>
  <path d="M585 125 H675" class="query"/>
  <text x="690" y="130" class="note">query: levert een read-only DTO</text>
  <text x="1050" y="130" class="note">«scheduled/manual» start de enige functie die agents mag starten · max. één run per module</text>

  <!-- Stakeholder actor -->
  <circle cx="260" cy="177" r="25" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
  <path d="M260 202 V236 M225 217 H295 M260 236 L232 260 M260 236 L288 260" fill="none" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/>
  <text x="315" y="185" class="module-title" style="font-size:20px">Stakeholder</text>
  <path d="M260 260 V292" class="command"/>
  <text x="278" y="281" class="flow">via gebruikersinterface en commands</text>

  <!-- Product en overleg -->
  <rect x="55" y="295" width="525" height="625" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <rect x="55" y="295" width="525" height="62" rx="18" fill="#e2e8f0"/>
  <path d="M55 337 V357 H580 V337" fill="#e2e8f0"/>
  <text x="80" y="335" class="module-title">Product en overleg</text>
  <text x="80" y="387" class="section-title">PUBLIEKE INTERFACE</text>
  <text x="80" y="417" class="api">«command» updateProductAssignment(...)</text>
  <text x="80" y="443" class="api">«command» configureTestableProduct(...)</text>
  <text x="80" y="469" class="api">«command» submitUserSignal(...)</text>
  <text x="80" y="495" class="api">«command» markUserSignalInReview(...)</text>
  <text x="80" y="521" class="api">«command» recordSignalInvestigation(...)</text>
  <text x="80" y="547" class="api">«command» linkSignalToEpic(...)</text>
  <text x="80" y="573" class="api" style="font-size:12px">«command» start/record/closeMeeting(...)</text>
  <text x="80" y="605" class="api">«query» getProductAssignment(...)</text>
  <text x="80" y="631" class="api">«query» getUserSignal(...) / findOpenUserSignals(...)</text>
  <text x="80" y="657" class="api">«query» getTestableProduct(...)</text>
  <text x="80" y="683" class="api">«query» getMeeting(...) / findMeetings(...)</text>
  <line x1="80" y1="735" x2="555" y2="735" class="divider" stroke="#cbd5e1"/>
  <text x="80" y="765" class="section-title">EIGEN PUBLIEKE ENTITEITEN</text>
  <text x="80" y="798" class="entity">Product · ProductAssignment · Meeting</text>
  <text x="80" y="829" class="entity">UserSignal · TestableProductConfiguration</text>
  <text x="80" y="891" class="note">Broninhoud van UserSignal blijft onveranderlijk.</text>
  <text x="80" y="913" class="note">Alleen status en gecontroleerde koppelingen mogen wijzigen.</text>

  <!-- Productontwerp -->
  <rect x="675" y="180" width="560" height="650" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <rect x="675" y="180" width="560" height="62" rx="18" fill="#dbeafe"/>
  <path d="M675 222 V242 H1235 V222" fill="#dbeafe"/>
  <text x="700" y="220" class="module-title">Productontwerp</text>
  <text x="700" y="272" class="section-title">PUBLIEKE INTERFACE</text>
  <text x="700" y="302" class="api">«scheduled/manual» runProcessSession()</text>
  <text x="700" y="334" class="api">«query» getEpic(...) / findAvailableEpics(...)</text>
  <text x="700" y="360" class="api">«query» findActiveEpics(...)</text>
  <text x="700" y="392" class="api">«command» claimEpicForPlanning(...)</text>
  <text x="700" y="418" class="api">«command» markEpicActive(...)</text>
  <text x="700" y="444" class="api">«command» markEpicReadyForVerification(...)</text>
  <text x="700" y="470" class="api">«command» recordEpicVerification(...)</text>
  <text x="700" y="496" class="api">«command» withdrawEpic(...) / cancelEpic(...)</text>
  <line x1="700" y1="552" x2="1210" y2="552" class="divider" stroke="#bfdbfe"/>
  <text x="700" y="582" class="section-title">EIGEN PUBLIEKE ENTITEITEN</text>
  <text x="700" y="615" class="entity">Epic · ProcessSession</text>
  <line x1="700" y1="646" x2="1210" y2="646" class="divider" stroke="#bfdbfe"/>
  <text x="700" y="676" class="section-title">BELANGRIJKE GRENS</text>
  <text x="700" y="707" class="note">Alleen Productontwerp schrijft Epic.</text>
  <text x="700" y="731" class="note">Na claim zijn inhoud, scope en UX van die versie bevroren.</text>
  <text x="700" y="755" class="note">Geen queue; planning ontdekt AVAILABLE epics zelf.</text>
  <text x="700" y="801" class="note">Droombeeld, leren, onderzoek, drafts en agents blijven intern.</text>

  <!-- Productplanning -->
  <rect x="675" y="890" width="560" height="590" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <rect x="675" y="890" width="560" height="62" rx="18" fill="#d1fae5"/>
  <path d="M675 932 V952 H1235 V932" fill="#d1fae5"/>
  <text x="700" y="930" class="module-title">Productplanning</text>
  <text x="700" y="982" class="section-title">PUBLIEKE INTERFACE</text>
  <text x="700" y="1012" class="api">«scheduled/manual» runProcessSession()</text>
  <text x="700" y="1044" class="api">«query» getStory(...) / getBacklog(...)</text>
  <text x="700" y="1070" class="api">«query» findPlanningWorkItems(...)</text>
  <text x="700" y="1096" class="api" style="font-size:12px">«command» requestBugfix(...) / requestEpicGapPlanning(...)</text>
  <text x="700" y="1122" class="api" style="font-size:11px">«command» requestEpicReprioritization(...) / requestManualReplan(...)</text>
  <text x="700" y="1148" class="api">«command» cancelStoriesForEpic(...)</text>
  <text x="700" y="1174" class="api">«command» markStoryAsDispatched/Developed(...)</text>
  <line x1="700" y1="1236" x2="1210" y2="1236" class="divider" stroke="#a7f3d0"/>
  <text x="700" y="1266" class="section-title">EIGEN PUBLIEKE ENTITEITEN</text>
  <text x="700" y="1299" class="entity">PlanningWorkItem · Story · ProcessSession</text>
  <line x1="700" y1="1328" x2="1210" y2="1328" class="divider" stroke="#a7f3d0"/>
  <text x="700" y="1358" class="section-title">BELANGRIJKE GRENS</text>
  <text x="700" y="1389" class="note">Alleen Productplanning schrijft Story, status en sequenceNumber.</text>
  <text x="700" y="1413" class="note">Backlog = Story(status TODO of IN_PROGRESS), op sequenceNumber.</text>
  <text x="700" y="1437" class="note">Queuecommands starten geen agents; lege backlog is geldig.</text>

  <!-- Kwaliteitsbewaking -->
  <g transform="translate(220 0)">
  <rect x="1370" y="180" width="650" height="680" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <rect x="1370" y="180" width="650" height="62" rx="18" fill="#ede9fe"/>
  <path d="M1370 222 V242 H2020 V222" fill="#ede9fe"/>
  <text x="1395" y="220" class="module-title">Kwaliteitsbewaking</text>
  <text x="1395" y="272" class="section-title">PUBLIEKE INTERFACE</text>
  <text x="1395" y="302" class="api">«scheduled/manual» runProcessSession()</text>
  <text x="1395" y="334" class="api">«query» getBug(...)</text>
  <text x="1395" y="360" class="api">«query» findVerifications(...)</text>
  <text x="1395" y="386" class="api" style="font-size:12px">«query» getCurrentQuality/history(...) / findQualityWorkItems(...)</text>
  <text x="1395" y="418" class="api">«command» requestStoryVerification(...)</text>
  <text x="1395" y="444" class="api">«command» requestEpicVerification(...)</text>
  <text x="1395" y="470" class="api">«command» requestBugfixRetest(...)</text>
  <text x="1395" y="496" class="api">«command» requestSignalInvestigation(...)</text>
  <text x="1395" y="522" class="api">«command» linkBugfixStory(...)</text>
  <line x1="1395" y1="552" x2="1995" y2="552" class="divider" stroke="#ddd6fe"/>
  <text x="1395" y="582" class="section-title">EIGEN PUBLIEKE ENTITEITEN</text>
  <text x="1395" y="615" class="entity" style="font-size:13px">QualityWorkItem · Bug · Verification · QualitySnapshot · ProcessSession</text>
  <line x1="1395" y1="644" x2="1995" y2="644" class="divider" stroke="#ddd6fe"/>
  <text x="1395" y="674" class="section-title">BELANGRIJKE GRENS</text>
  <text x="1395" y="705" class="note">Queuecommands bewaren alleen werk; alleen de run start agents.</text>
  <text x="1395" y="729" class="note">Verification richt zich op STORY, EPIC of USER_SIGNAL.</text>
  <text x="1395" y="753" class="note">Kwaliteitsbewaking schrijft geen Story, Epic of UserSignal.</text>
  <text x="1395" y="801" class="note">Iedere niet-lege testsessie maakt een QualitySnapshot.</text>
  </g>

  <!-- Besluitenregister -->
  <rect x="55" y="1030" width="525" height="390" rx="18" fill="#fff1f2" stroke="#be123c" stroke-width="3"/>
  <rect x="55" y="1030" width="525" height="62" rx="18" fill="#ffe4e6"/>
  <path d="M55 1072 V1092 H580 V1072" fill="#ffe4e6"/>
  <text x="80" y="1070" class="module-title">Besluitenregister</text>
  <text x="80" y="1122" class="section-title">PUBLIEKE INTERFACE</text>
  <text x="80" y="1152" class="api" style="font-size:12px">«command» createDecision(...) / reviseDecision(...)</text>
  <text x="80" y="1178" class="api" style="font-size:12px">«command» withdrawDecision(...) / supersedeDecisions(...)</text>
  <text x="80" y="1210" class="api">«query» getDecisions(productId, validAt?)</text>
  <text x="80" y="1236" class="api">«query» getDecisionArchive(productId)</text>
  <line x1="80" y1="1260" x2="555" y2="1260" class="divider" stroke="#fecdd3"/>
  <text x="80" y="1290" class="section-title">EIGEN PUBLIEKE ENTITEITEN</text>
  <text x="80" y="1323" class="entity">Decision · DecisionDetails</text>
  <line x1="80" y1="1352" x2="555" y2="1352" class="divider" stroke="#fecdd3"/>
  <text x="80" y="1382" class="note">Alleen grote besluiten · origin STAKEHOLDER of FACTORY.</text>
  <text x="80" y="1406" class="note">Normale query = geldige versie; archief = alles.</text>

  <!-- Dispatcher -->
  <g transform="translate(220 0)">
  <rect x="1370" y="960" width="650" height="380" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <rect x="1370" y="960" width="650" height="62" rx="18" fill="#ffedd5"/>
  <path d="M1370 1002 V1022 H2020 V1002" fill="#ffedd5"/>
  <text x="1395" y="1000" class="module-title">Software Factory-dispatcher</text>
  <text x="1395" y="1052" class="section-title">PUBLIEKE INTERFACE</text>
  <text x="1395" y="1082" class="api">«scheduled» runDispatchSession()</text>
  <line x1="1395" y1="1112" x2="1995" y2="1112" class="divider" stroke="#fed7aa"/>
  <text x="1395" y="1142" class="section-title">EIGEN PUBLIEKE ENTITEITEN</text>
  <text x="1395" y="1175" class="entity">DeliveryAttempt</text>
  <line x1="1395" y1="1204" x2="1995" y2="1204" class="divider" stroke="#fed7aa"/>
  <text x="1395" y="1234" class="section-title">GEBRUIKT</text>
  <text x="1395" y="1265" class="note">Storyqueries en storycommands van Productplanning.</text>
  <text x="1395" y="1289" class="note">Externe Software Factory API.</text>
  <text x="1395" y="1313" class="note">StoryDeliveryPackage is transport, geen entiteit.</text>
  </g>

  <!-- Software Factory external system -->
  <g transform="translate(220 0)">
  <rect x="1515" y="1410" width="360" height="100" rx="18" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
  <text x="1540" y="1450" class="module-title">Software Factory</text>
  <text x="1540" y="1480" class="note">extern systeem</text>
  </g>

  <!-- Queries and commands between modules -->
  <path d="M580 390 H675" class="query"/>
  <text x="608" y="378" class="flow">gitUrl</text>

  <path d="M580 600 C620 770 620 1015 675 1044" class="query"/>
  <text x="585" y="835" class="flow">product · gitUrl · omgevingen</text>

  <path d="M580 700 C625 850 625 1100 675 1128" class="command"/>
  <text x="585" y="965" class="flow">urgente epic prioriteren</text>

  <path d="M580 320 C960 105 1320 105 1590 300" class="query"/>
  <text x="890" y="158" class="flow">ProductAssignmentDetails(gitUrl) · UserSignalDetails · testomgevingen</text>

  <path d="M820 890 V830" class="command"/>
  <text x="690" y="856" class="flow">epic lifecycle commands</text>
  <path d="M1040 830 V890" class="command"/>
  <text x="1055" y="858" class="flow">cancelStoriesForEpic(...)</text>
  <path d="M1160 830 V890" class="query"/>
  <text x="1168" y="876" class="flow">EpicDetails</text>

  <path d="M1235 350 H1590" class="query"/>
  <text x="1415" y="338" class="flow">EpicDetails</text>
  <path d="M1590 400 H1235" class="query"/>
  <text x="1330" y="388" class="flow">Verification · QualitySnapshot</text>
  <path d="M1590 665 H1235" class="command"/>
  <text x="1370" y="650" class="flow">recordEpicVerification(...)</text>

  <path d="M1590 760 H1510 V1102 H1235" class="command"/>
  <text x="1260" y="1068" class="flow">queue naar planning</text>
  <text x="1260" y="1088" class="flow">requestBugfix / requestEpicGapPlanning</text>
  <path d="M1235 1044 H1415 V800 H1590" class="query"/>
  <text x="1435" y="786" class="flow">StoryDetails</text>

  <path d="M1235 1180 H1460 V470 H1590" class="command"/>
  <text x="1260" y="1146" class="flow">queue naar kwaliteit</text>
  <text x="1260" y="1166" class="flow">story / epic / bugfix-hertest</text>

  <path d="M1590 1250 H1235" class="command"/>
  <text x="1290" y="1236" class="flow">story lifecycle commands</text>
  <path d="M1235 1035 H1590" class="query"/>
  <text x="1365" y="1021" class="flow">eerste TODO StoryDetails</text>

  <path d="M1750 1340 V1410" class="command"/>
  <text x="1597" y="1380" class="flow">StoryDeliveryPackage</text>
  <path d="M2035 1410 V1340" class="query"/>
  <text x="2050" y="1380" class="flow">werkstatus</text>

  <!-- Decision commands are summarized to avoid crossing every module -->
  <path d="M320 920 V1030" class="command"/>
  <text x="335" y="980" class="flow">create / revise / withdraw / supersede</text>
  <text x="80" y="1448" class="note">De getoonde module-interface is leidend.</text>
  <text x="80" y="1470" class="note">Niet iedere toegestane relatie heeft een pijl.</text>
</svg>
