<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1380" viewBox="0 0 2200 1380" role="img" aria-labelledby="title desc">
  <title id="title">Product Factory v2 processen, entiteiteigenaren en gegevensstromen</title>
  <desc id="desc">Diagram met de Stakeholder, product- en overlegmodules, Productontwerp, Productplanning, Kwaliteitsbewaking, de Software Factory-dispatcher en het Besluitenregister. Iedere module bevat haar eigen duurzame entiteiten. Pijlen tonen read-only queries en betekenisvolle commands aan de eigenaar.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 23px Inter, Arial, sans-serif; fill: #0f172a; }
      .function { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .owner-label { font: 700 13px Inter, Arial, sans-serif; letter-spacing: 1px; fill: #64748b; }
      .entity { font: 500 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #172033; }
      .note { font: 400 14px Inter, Arial, sans-serif; fill: #64748b; }
      .flow { font: 600 14px Inter, Arial, sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .flow-small { font: 600 13px Inter, Arial, sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowBlue); }
      .green-line { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#arrowGreen); }
      .purple-line { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrowPurple); }
      .dashed { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="2200" height="1380" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Product Factory v2 — eigenaarschap en publieke gegevensstromen</text>
  <text x="60" y="94" class="subtitle">Eén eigenaar schrijft; andere modules lezen DTO's of vragen via een betekenisvol command om een geldige overgang.</text>

  <!-- Ondersteunende productmodules -->
  <rect x="50" y="155" width="365" height="385" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="50" y="155" width="365" height="62" rx="18" fill="#e2e8f0"/>
  <path d="M50 199 V217 H415 V199" fill="#e2e8f0"/>
  <text x="76" y="193" class="box-title">Product en overleg</text>
  <text x="76" y="245" class="owner-label">SCHRIJFT</text>
  <text x="76" y="274" class="entity">Product</text>
  <text x="76" y="308" class="entity">Stakeholder</text>
  <text x="76" y="342" class="entity">ProductAssignment</text>
  <text x="76" y="376" class="entity">StakeholderDirection</text>
  <text x="76" y="410" class="entity">UserSignal + status</text>
  <text x="76" y="444" class="entity" style="font-size:14px">TestableProductConfiguration</text>
  <line x1="76" y1="468" x2="389" y2="468" stroke="#cbd5e1"/>
  <text x="76" y="496" class="note">Ontvangt commands; de Stakeholder schrijft</text>
  <text x="76" y="518" class="note">geen databaseobjecten rechtstreeks.</text>

  <!-- Productontwerp -->
  <rect x="520" y="155" width="410" height="385" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <rect x="520" y="155" width="410" height="74" rx="18" fill="#dbeafe"/>
  <path d="M520 207 V229 H930 V207" fill="#dbeafe"/>
  <text x="546" y="190" class="box-title">Productontwerp</text>
  <text x="546" y="215" class="function">runProcessSession()</text>
  <text x="546" y="260" class="owner-label">SCHRIJFT</text>
  <text x="546" y="296" class="entity">DirectionSnapshot</text>
  <text x="546" y="334" class="entity">Epic + status</text>
  <text x="546" y="372" class="entity">ProcessSession</text>
  <line x1="546" y1="394" x2="904" y2="394" stroke="#bfdbfe"/>
  <text x="546" y="424" class="note">Onderzoekt de productrichting en maakt</text>
  <text x="546" y="446" class="note">complete epics inclusief UX. Geen stories.</text>
  <text x="546" y="476" class="note">Commands: claim · activeer · controleer.</text>
  <text x="546" y="502" class="note">LearningResult blijft intern.</text>
  <text x="546" y="526" class="owner-label">REGISTREERT BETEKENISVOLLE BESLUITEN</text>

  <!-- Productplanning -->
  <rect x="520" y="705" width="410" height="480" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <rect x="520" y="705" width="410" height="74" rx="18" fill="#d1fae5"/>
  <path d="M520 757 V779 H930 V757" fill="#d1fae5"/>
  <text x="546" y="740" class="box-title">Productplanning</text>
  <text x="546" y="765" class="function">runProcessSession()</text>
  <text x="546" y="810" class="owner-label">SCHRIJFT</text>
  <text x="546" y="846" class="entity">Story</text>
  <text x="546" y="882" class="entity">ProcessSession</text>
  <text x="546" y="918" class="entity">PlanningRequest</text>
  <line x1="546" y1="978" x2="904" y2="978" stroke="#a7f3d0"/>
  <text x="546" y="1007" class="note">Claimt via Productontwerp; maakt stories.</text>
  <text x="546" y="1029" class="note">Backlog = status ≠ DONE, op sequenceNumber.</text>
  <text x="546" y="1058" class="note">Story: TODO · IN_PROGRESS · DONE.</text>
  <text x="546" y="1087" class="note">BacklogSupply is een query, geen entiteit.</text>
  <text x="546" y="1116" class="note">Dispatcher gebruikt publieke commands.</text>

  <!-- Dispatcher -->
  <rect x="1030" y="805" width="315" height="310" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <rect x="1030" y="805" width="315" height="84" rx="18" fill="#ffedd5"/>
  <path d="M1030 867 V889 H1345 V867" fill="#ffedd5"/>
  <text x="1054" y="839" class="box-title">SF-dispatcher</text>
  <text x="1054" y="865" class="function">runDispatchSession()</text>
  <text x="1054" y="922" class="owner-label">SCHRIJFT TECHNISCHE HISTORIE</text>
  <text x="1054" y="958" class="entity">DeliveryAttempt</text>
  <text x="1054" y="994" class="entity">StoryDeliveryPackage</text>
  <line x1="1054" y1="1054" x2="1321" y2="1054" stroke="#fed7aa"/>
  <text x="1054" y="1082" class="note">Verstuurt maximaal één volledig</text>
  <text x="1054" y="1104" class="note">pakket inclusief UX en assets.</text>

  <!-- Software Factory -->
  <rect x="1030" y="1210" width="315" height="105" rx="18" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="1054" y="1252" class="box-title">Software Factory</text>
  <text x="1054" y="1282" class="note">Externe uitvoering en ruwe werkstatus</text>

  <!-- Kwaliteitsbewaking -->
  <rect x="1430" y="360" width="325" height="570" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <rect x="1430" y="360" width="325" height="74" rx="18" fill="#ede9fe"/>
  <path d="M1430 412 V434 H1755 V412" fill="#ede9fe"/>
  <text x="1454" y="395" class="box-title">Kwaliteitsbewaking</text>
  <text x="1454" y="420" class="function">runProcessSession()</text>
  <text x="1454" y="465" class="owner-label">SCHRIJFT</text>
  <text x="1454" y="501" class="entity">Bug</text>
  <text x="1454" y="537" class="entity">Verification</text>
  <text x="1454" y="573" class="entity">ProcessSession</text>
  <text x="1454" y="621" class="note">Verification target:</text>
  <text x="1454" y="645" class="note">STORY · EPIC · USER_SIGNAL</text>
  <text x="1454" y="681" class="note">QualityOverview is een query.</text>
  <line x1="1454" y1="777" x2="1731" y2="777" stroke="#ddd6fe"/>
  <text x="1454" y="806" class="note">Toetst stories, bugfixes, epics en</text>
  <text x="1454" y="828" class="note">gebruikerssignalen en bewijs.</text>
  <text x="1454" y="864" class="note">Publiceert bewijs en bevindingen;</text>
  <text x="1454" y="886" class="note">maakt geen stories.</text>

  <!-- Scheduler -->
  <rect x="50" y="760" width="365" height="135" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="76" y="800" class="box-title">Scheduler</text>
  <text x="76" y="830" class="owner-label">ROEPT AAN, SCHRIJFT GEEN RESULTATEN</text>
  <text x="76" y="860" class="function">runProcessSession() × 3</text>
  <text x="76" y="884" class="function">runDispatchSession()</text>

  <!-- Frontend -->
  <rect x="50" y="925" width="365" height="130" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="76" y="965" class="box-title">Frontend</text>
  <text x="76" y="995" class="owner-label">LEEST VIA QUERY-API'S</text>
  <text x="76" y="1023" class="entity">read-only ...Details DTO's</text>
  <text x="76" y="1046" class="note">Commands gaan naar de eigenaarsmodule.</text>

  <!-- Stakeholder -->
  <rect x="50" y="1090" width="365" height="205" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <rect x="50" y="1090" width="365" height="58" rx="18" fill="#fef9c3"/>
  <path d="M50 1130 V1148 H415 V1130" fill="#fef9c3"/>
  <text x="76" y="1128" class="box-title">Stakeholder</text>
  <text x="76" y="1176" class="owner-label">LEVERT VIA PRODUCT / OVERLEG</text>
  <text x="76" y="1208" class="note">profiel · productopdracht · richting</text>
  <text x="76" y="1232" class="note">antwoorden · signalen · kwaliteitszorg</text>
  <text x="76" y="1270" class="note">Maakt geen epics, stories, bugs of backlog.</text>

  <!-- Besluitenregister -->
  <rect x="1430" y="970" width="325" height="325" rx="18" fill="#fff1f2" stroke="#be123c" stroke-width="3"/>
  <rect x="1430" y="970" width="325" height="74" rx="18" fill="#ffe4e6"/>
  <path d="M1430 1022 V1044 H1755 V1022" fill="#ffe4e6"/>
  <text x="1454" y="1005" class="box-title">Besluitenregister</text>
  <text x="1454" y="1030" class="function">geen scheduler of agents</text>
  <text x="1454" y="1075" class="owner-label">SCHRIJFT</text>
  <text x="1454" y="1111" class="entity">DecisionRecord</text>
  <line x1="1454" y1="1135" x2="1731" y2="1135" stroke="#fecdd3"/>
  <text x="1454" y="1164" class="note">Neemt geen besluiten; registreert</text>
  <text x="1454" y="1186" class="note">keuzes van bevoegde bronmodules.</text>
  <text x="1454" y="1220" class="note">validFrom · validUntil</text>
  <text x="1454" y="1242" class="note">Actief · Vervangen · Ingetrokken</text>
  <text x="1454" y="1264" class="note">supersedes · replacedBy</text>

  <!-- Gegevensstromen -->
  <path d="M415 275 H520" class="blue-line"/>
  <text x="429" y="262" class="flow-small">profiel · opdracht · richting · signalen</text>

  <path d="M330 540 C350 700 420 820 520 820" class="green-line"/>
  <text x="327" y="659" class="flow-small">profiel · opdracht · richting</text>

  <path d="M415 395 C850 90 1350 130 1430 400" class="purple-line"/>
  <text x="955" y="165" class="flow-small">richting · UserSignalDetails</text>
  <text x="1010" y="186" class="flow-small">profiel · testconfiguratie</text>

  <path d="M1430 650 C1170 625 790 605 415 445" class="purple-line"/>
  <text x="925" y="607" class="flow-small">recordSignalInvestigation(...)</text>

  <path d="M725 540 V705" class="green-line"/>
  <text x="740" y="620" class="flow">EpicDetails + claim command</text>

  <path d="M930 330 C1110 250 1280 265 1430 465" class="purple-line"/>
  <text x="1050" y="283" class="flow">EpicDetails</text>

  <path d="M520 755 C460 730 455 570 520 505" class="blue-line"/>
  <text x="250" y="590" class="flow-small">Epic is eigen output</text>
  <text x="250" y="610" class="flow-small">BacklogSupply query</text>

  <path d="M930 845 C1120 690 1270 610 1430 570" class="purple-line"/>
  <text x="995" y="696" class="flow-small">EpicDetails · StoryDetails</text>

  <path d="M1430 700 C1250 720 1090 760 930 815" class="green-line"/>
  <text x="1080" y="748" class="flow-small">bugs · verificaties · plancommands</text>

  <path d="M1430 520 C1250 470 1110 455 930 475" class="blue-line"/>
  <text x="1032" y="446" class="flow-small">VerificationDetails · QualityOverview</text>
  <text x="1032" y="466" class="flow-small">recordEpicVerification(...)</text>

  <path d="M930 955 H1030" class="line"/>
  <text x="938" y="940" class="flow-small">eerste TODO-story</text>

  <path d="M1030 1045 C985 1045 970 1012 930 1012" class="green-line"/>
  <text x="939" y="1067" class="flow-small">story lifecycle commands</text>

  <path d="M1345 970 C1380 970 1390 850 1430 850" class="purple-line"/>
  <text x="1320" y="951" class="flow-small">levering</text>

  <path d="M1125 805 C1110 590 1020 520 930 500" class="blue-line"/>
  <text x="960" y="554" class="flow-small">StoryDetails</text>

  <path d="M1187 1115 V1210" class="line"/>
  <path d="M1215 1210 V1115" class="line"/>
  <text x="1232" y="1160" class="flow-small">volledig pakket</text>
  <text x="1232" y="1180" class="flow-small">/ status</text>

  <path d="M145 1090 C15 950 10 690 50 500" class="line"/>
  <text x="12" y="805" class="flow-small" transform="rotate(-90 12 805)">profiel · opdracht · richting · signalen</text>

  <path d="M930 300 H1790 V1185 H1755" class="line dashed"/>
  <text x="1470" y="287" class="flow-small">ontwerpbesluiten</text>

  <path d="M415 155 V130 H1805 V1240 H1755" class="line dashed"/>
  <text x="1510" y="118" class="flow-small">Stakeholderbesluiten</text>

  <path d="M930 1160 H1390 Q1430 1160 1430 1120" class="line dashed"/>
  <text x="1160" y="1147" class="flow-small">planningbesluiten</text>

  <!-- Legenda -->
  <rect x="50" y="1335" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="74" y="1347" class="note">Productontwerp</text>
  <rect x="220" y="1335" width="14" height="14" rx="3" fill="#d1fae5" stroke="#059669"/>
  <text x="244" y="1347" class="note">Productplanning</text>
  <rect x="405" y="1335" width="14" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="429" y="1347" class="note">Kwaliteitsbewaking</text>
  <rect x="620" y="1335" width="14" height="14" rx="3" fill="#ffedd5" stroke="#ea580c"/>
  <text x="644" y="1347" class="note">Dispatcher</text>
  <rect x="750" y="1335" width="14" height="14" rx="3" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="774" y="1347" class="note">Stakeholder</text>
  <rect x="910" y="1335" width="14" height="14" rx="3" fill="#ffe4e6" stroke="#be123c"/>
  <text x="934" y="1347" class="note">Besluitenregister</text>
  <text x="1095" y="1347" class="note">De volledige lezerlijst en veldgrenzen staan in de tabel van het design-document.</text>
</svg>
