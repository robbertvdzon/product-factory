.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;

.form-check-label {
  color: var(--foreground);

  height: 20px;

  box-shadow: none;

  left: 0;

  height: 16px;

  border-radius: var(--radius-full);

  box-shadow: var(--shadow-sm);

  background: var(--primary);

  padding: 0;

  height: 28px;
  background: transparent;

.form-range::-moz-range-thumb {

  height: 20px;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);

.btn:focus-visible,
.nav-link:focus-visible {

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;

  .form-select {

    min-width: 44px;
    min-height: 44px;
  }

    width: 44px;
    height: 44px;
  }

    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],

    min-width: 0;

    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

svg.lucide {

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
const root=document.getElementById(&#x27;pf-prototype&#x27;);
const s={role:&#x27;po&#x27;,stage:&#x27;draft&#x27;,page:&#x27;home&#x27;,tab:&#x27;overview&#x27;,ux:&#x27;main&#x27;,mobile:false,filter:false,impact:null,chat:[],idea:&#x27;&#x27;,answered:false,question:&#x27;&#x27;,story:null,archAnswer:&#x27;&#x27;,decision:&#x27;&#x27;,adjusted:false,approved:false,poApproved:false};
const design={compact:false,showStories:true};
const roles={po:&#x27;Marc · product owner&#x27;,architect:&#x27;Robbert · architect&#x27;,owner:&#x27;Robbert · factory owner&#x27;};
const title=&#x27;Sneller zien welke agendapunten aandacht vragen&#x27;;
const esc=v=&gt;String(v).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const b=(label,action,primary=false,extra=&#x27;&#x27;)=&gt;`&lt;button class=&quot;pf-btn ${primary?&#x27;pf-primary&#x27;:&#x27;&#x27;}&quot; data-action=&quot;${action}&quot; ${extra}&gt;${label}&lt;/button&gt;`;
const tag=(text,tone=&#x27;&#x27;)=&gt;`&lt;span class=&quot;pf-tag ${tone}&quot;&gt;${text}&lt;/span&gt;`;
const heading=(eyebrow,name,desc=&#x27;&#x27;,action=&#x27;&#x27;)=&gt;`&lt;div class=&quot;pf-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;pf-eyebrow&quot;&gt;${eyebrow}&lt;/div&gt;&lt;h1&gt;${name}&lt;/h1&gt;${desc?`&lt;p&gt;${desc}&lt;/p&gt;`:&#x27;&#x27;}&lt;/div&gt;${action}&lt;/div&gt;`;
const panel=(name,content)=&gt;`&lt;section class=&quot;pf-panel&quot;&gt;${name?`&lt;h2&gt;${name}&lt;/h2&gt;`:&#x27;&#x27;}${content}&lt;/section&gt;`;
const callout=(name,text,action=&#x27;&#x27;,tone=&#x27;&#x27;)=&gt;`&lt;div class=&quot;pf-callout ${tone}&quot;&gt;&lt;div&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;p&gt;${text}&lt;/p&gt;&lt;/div&gt;${action}&lt;/div&gt;`;
const tabs=(items,current,kind=&#x27;tab&#x27;)=&gt;`&lt;nav class=&quot;pf-tabs&quot; aria-label=&quot;Epiconderdelen&quot;&gt;${items.map(([key,label])=&gt;`&lt;button class=&quot;pf-tab ${key===current?&#x27;active&#x27;:&#x27;&#x27;}&quot; data-${kind}=&quot;${key}&quot; aria-current=&quot;${key===current?&#x27;page&#x27;:&#x27;false&#x27;}&quot;&gt;${label}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;`;
const status=()=&gt;({draft:&#x27;Samen uitwerken&#x27;,review:s.adjusted&amp;&amp;!s.poApproved?&#x27;Marc beoordeelt de aanpassing&#x27;:&#x27;Architect beoordeelt&#x27;,planning:s.answered?&#x27;Planning gaat verder&#x27;:&#x27;Vraag aan Marc&#x27;,building:&#x27;Wordt gebouwd&#x27;,delivered:&#x27;Opgeleverd&#x27;})[s.stage];
const version=()=&gt;s.adjusted?3:2;
function steps(){const idx={draft:0,review:1,planning:2,building:3,delivered:4}[s.stage];return `&lt;div class=&quot;pf-steps&quot;&gt;${[&#x27;Uitwerken&#x27;,&#x27;Goedkeuren&#x27;,&#x27;Planning&#x27;,&#x27;Bouwen &amp; testen&#x27;,&#x27;Opgeleverd&#x27;].map((v,i)=&gt;`&lt;div class=&quot;pf-step ${i&lt;idx?&#x27;done&#x27;:i===idx?&#x27;current&#x27;:&#x27;&#x27;}&quot;&gt;${i&lt;idx?&#x27;✓ &#x27;:&#x27;&#x27;}${v}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function row(name,sub,action,st=&#x27;&#x27;){return `&lt;div class=&quot;pf-row&quot;&gt;&lt;div&gt;&lt;strong&gt;${name}&lt;/strong&gt;${st?` &lt;span&gt;${st}&lt;/span&gt;`:&#x27;&#x27;}&lt;p&gt;${sub}&lt;/p&gt;&lt;/div&gt;${action}&lt;/div&gt;`;}
function toast(text){root.querySelector(&#x27;#pf-toast&#x27;).textContent=text;}
function nav(){let items=s.role===&#x27;po&#x27;?[[&#x27;home&#x27;,&#x27;Mijn werk&#x27;],[&#x27;epic&#x27;,&#x27;Mijn epics&#x27;],[&#x27;questions&#x27;,&#x27;Vragen&#x27;,s.stage===&#x27;planning&#x27;&amp;&amp;!s.answered?&#x27;1&#x27;:&#x27;&#x27;]]:s.role===&#x27;architect&#x27;?[[&#x27;home&#x27;,&#x27;Te beoordelen&#x27;,s.stage===&#x27;review&#x27;&amp;&amp;!s.approved?&#x27;1&#x27;:&#x27;&#x27;],[&#x27;impact&#x27;,&#x27;Epicimpact&#x27;],[&#x27;rules&#x27;,&#x27;Productafspraken&#x27;]]:[[&#x27;home&#x27;,&#x27;Factoryoverzicht&#x27;],[&#x27;runs&#x27;,&#x27;Runs&#x27;],[&#x27;planning&#x27;,&#x27;Planning&#x27;],[&#x27;quality&#x27;,&#x27;Kwaliteit&#x27;],[&#x27;settings&#x27;,&#x27;Instellingen&#x27;]];root.querySelector(&#x27;#pf-sidebar&#x27;).innerHTML=`&lt;div class=&quot;pf-project&quot;&gt;&lt;span class=&quot;pf-small pf-muted&quot;&gt;${s.role===&#x27;owner&#x27;?&#x27;Alle producten&#x27;:&#x27;Project&#x27;}&lt;/span&gt;&lt;strong&gt;${s.role===&#x27;owner&#x27;?&#x27;Factorybeheer&#x27;:&#x27;PvdD&#x27;}&lt;/strong&gt;&lt;span class=&quot;pf-small pf-muted&quot;&gt;${s.role===&#x27;po&#x27;?&#x27;Productontwikkeling&#x27;:s.role===&#x27;architect&#x27;?&#x27;Architectuur &amp; product-AI&#x27;:&#x27;Operatie &amp; inrichting&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;nav aria-label=&quot;Hoofdnavigatie&quot;&gt;${items.map(([key,label,count])=&gt;`&lt;button class=&quot;pf-nav ${s.page===key?&#x27;active&#x27;:&#x27;&#x27;}&quot; data-page=&quot;${key}&quot;&gt;${label}${count?tag(count,&#x27;amber&#x27;):&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;&lt;div class=&quot;pf-nav-note&quot;&gt;${s.role===&#x27;po&#x27;?&#x27;Jij bepaalt wat het product moet doen. AI helpt je het uit te werken.&#x27;:s.role===&#x27;architect&#x27;?&#x27;Jij beslist over technische impact, product-AI en uitzonderingen.&#x27;:&#x27;Productbesluiten liggen bij de PO en architect.&#x27;}&lt;/div&gt;`;}
function poHome(){let notice=s.stage===&#x27;draft&#x27;?callout(&#x27;Je idee krijgt vorm&#x27;,&#x27;Bekijk het voorstel en geef aan wat je anders wilt.&#x27;,b(&#x27;Verder uitwerken&#x27;,&#x27;epic&#x27;,true),&#x27;blue&#x27;):s.stage===&#x27;review&#x27;?callout(s.adjusted&amp;&amp;!s.poApproved?&#x27;Er is een aangepaste versie&#x27;:&#x27;Jouw functionele akkoord is gegeven&#x27;,s.adjusted&amp;&amp;!s.poApproved?&#x27;De architect stelt voor alleen gewijzigde stukken te analyseren. Bekijk de wijziging.&#x27;:&#x27;Robbert kijkt naar de analysefrequentie. Jij hoeft nu niets te doen.&#x27;,b(&#x27;Bekijk epic&#x27;,&#x27;epic&#x27;),s.adjusted?&#x27;&#x27;:&#x27;green&#x27;):s.stage===&#x27;planning&#x27;?callout(s.answered?&#x27;Bedankt, je antwoord is verwerkt&#x27;:&#x27;Er is één vraag voor jou&#x27;,s.answered?&#x27;De planner gaat verder met het opdelen van je epic.&#x27;:&#x27;De planner wil weten welke agendapunten bovenaan moeten staan.&#x27;,b(s.answered?&#x27;Bekijk voortgang&#x27;:&#x27;Beantwoord vraag&#x27;,s.answered?&#x27;progress&#x27;:&#x27;questions&#x27;,true),s.answered?&#x27;green&#x27;:&#x27;&#x27;):s.stage===&#x27;delivered&#x27;?callout(&#x27;Je idee is opgeleverd&#x27;,&#x27;Het overzicht met aandachtspunten is beschikbaar in PvdD.&#x27;,b(&#x27;Bekijk resultaat&#x27;,&#x27;progress&#x27;,true),&#x27;green&#x27;):callout(&#x27;Je epic wordt gebouwd&#x27;,&#x27;2 van de 4 stories zijn gereed. Er zijn geen open vragen aan jou.&#x27;,b(&#x27;Volg de bouw&#x27;,&#x27;progress&#x27;),&#x27;blue&#x27;);return heading(&#x27;Mijn werk&#x27;,&#x27;Goedemorgen Marc&#x27;,&#x27;Van jouw idee naar een verbetering in PvdD.&#x27;,b(&#x27;+ Nieuw idee&#x27;,&#x27;new&#x27;,true))+notice+panel(&#x27;Jouw epics&#x27;,row(title,&#x27;Door jou gestart · bijgewerkt vandaag&#x27;,b(&#x27;Open epic&#x27;,&#x27;epic&#x27;),tag(status(),&#x27;blue&#x27;))+row(&#x27;Bronverwijzingen bij een analyse&#x27;,&#x27;Opgeleverd · vorige week&#x27;,b(&#x27;Bekijk resultaat&#x27;,&#x27;other-delivery&#x27;),tag(&#x27;Opgeleverd&#x27;,&#x27;green&#x27;)))+`&lt;div class=&quot;pf-two&quot;&gt;${panel(&#x27;Een idee hoeft niet af te zijn&#x27;,&#x27;&lt;p class=&quot;pf-muted&quot;&gt;Beschrijf wat je mist of wat makkelijker zou kunnen. Je hoeft nog geen oplossing te hebben.&lt;/p&gt;&#x27;+b(&#x27;Bespreek een idee&#x27;,&#x27;new&#x27;))}${panel(&#x27;Voor jou overzichtelijk&#x27;,&#x27;&lt;p class=&quot;pf-muted&quot;&gt;Je ziet hier je ideeën, vragen en opleveringen. Per epic kun je ook de afzonderlijke stories volgen.&lt;/p&gt;&#x27;)}&lt;/div&gt;`;}
function newIdea(){return heading(&#x27;Nieuw idee&#x27;,&#x27;Wat wil je verbeteren?&#x27;,&#x27;Vertel het zoals je het aan een collega zou vertellen.&#x27;)+panel(&#x27;&#x27;,`&lt;label&gt;Je idee&lt;textarea id=&quot;pf-idea&quot; placeholder=&quot;Bijvoorbeeld: ik wil bij een vergadering sneller zien welke onderwerpen aandacht nodig hebben.&quot;&gt;${esc(s.idea)}&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;pf-meta&quot;&gt;Voor PvdD · samen met Product Advisor&lt;/div&gt;${b(&#x27;Samen uitwerken&#x27;,&#x27;create-idea&#x27;,true)}&lt;div class=&quot;pf-btnrow&quot;&gt;${b(&#x27;Gebruik voorbeeldidee&#x27;,&#x27;example&#x27;)}&lt;/div&gt;`);}
function epicHeader(){return `&lt;button class=&quot;pf-link&quot; data-page=&quot;home&quot;&gt;← Mijn werk&lt;/button&gt;`+heading(`Epic · versie ${version()}`,title)+`&lt;div class=&quot;pf-meta&quot;&gt;${tag(status(),&#x27;blue&#x27;)}&lt;span&gt;PO: Marc&lt;/span&gt;&lt;span&gt;Architect: Robbert&lt;/span&gt;&lt;/div&gt;`+steps();}
function conversation(){return panel(&#x27;Samen uitwerken&#x27;,`&lt;div class=&quot;pf-chat&quot;&gt;&lt;div class=&quot;pf-message mine&quot;&gt;&lt;strong&gt;Marc&lt;/strong&gt;&lt;p&gt;${esc(s.idea||&#x27;Ik wil sneller zien welke onderwerpen aandacht nodig hebben. Kunnen we de AI elke tien minuten laten kijken?&#x27;)}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;pf-message&quot;&gt;&lt;strong&gt;Product Advisor&lt;/strong&gt;&lt;p&gt;Ik stel een overzicht voor met een korte toelichting per aandachtspunt en links naar de bronstukken.&lt;/p&gt;&lt;p&gt;Wil je vooral nieuwe punten herkennen, of ook bestaande punten opnieuw beoordelen?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;pf-message mine&quot;&gt;&lt;strong&gt;Marc&lt;/strong&gt;&lt;p&gt;Vooral nieuwe of gewijzigde stukken. En ik wil zelf kunnen bepalen wat echt belangrijk is.&lt;/p&gt;&lt;/div&gt;${s.chat.map(x=&gt;`&lt;div class=&quot;pf-message ${x.who===&#x27;Marc&#x27;?&#x27;mine&#x27;:&#x27;&#x27;}&quot;&gt;&lt;strong&gt;${x.who}&lt;/strong&gt;&lt;p&gt;${esc(x.text)}&lt;/p&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;label&gt;Bespreek de uitwerking&lt;textarea id=&quot;pf-chat-input&quot; placeholder=&quot;Wat wil je aanpassen of verder bespreken?&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;pf-btnrow&quot;&gt;${b(&#x27;Verstuur&#x27;,&#x27;send&#x27;,true)}&lt;/div&gt;&lt;div class=&quot;pf-small pf-muted&quot; style=&quot;margin-top:10px&quot;&gt;Antwoorden in dit prototype zijn voorbeelden.&lt;/div&gt;`);}
function dossier(){return panel(&#x27;Dit gaan we verbeteren&#x27;,`&lt;h3&gt;Doel&lt;/h3&gt;&lt;p&gt;Marc ziet snel welke nieuwe of gewijzigde agendapunten aandacht verdienen, met een herleidbare toelichting.&lt;/p&gt;&lt;h3&gt;Werking&lt;/h3&gt;&lt;ul class=&quot;pf-list&quot;&gt;&lt;li&gt;Een overzicht per vergadering met een filter ‘Aandacht nodig’.&lt;/li&gt;&lt;li&gt;Per punt een korte reden, bronverwijzingen en een link naar de volledige analyse.&lt;/li&gt;&lt;li&gt;Marc kan een punt markeren als bekeken.&lt;/li&gt;&lt;li&gt;${s.adjusted?&#x27;Nieuwe of gewijzigde stukken worden automatisch geanalyseerd.&#x27;:&#x27;Het voorstel vraagt om een AI-controle iedere tien minuten.&#x27;}&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;Buiten deze epic&lt;/h3&gt;&lt;p class=&quot;pf-muted&quot;&gt;Geen automatisch verzonden adviezen en geen automatische besluitvorming.&lt;/p&gt;&lt;h3&gt;Klaar als&lt;/h3&gt;&lt;ul class=&quot;pf-checks&quot;&gt;&lt;li&gt;Nieuwe aandachtspunten zijn herkenbaar.&lt;/li&gt;&lt;li&gt;Elke toelichting verwijst naar de gebruikte stukken.&lt;/li&gt;&lt;li&gt;Bekeken punten blijven terug te vinden.&lt;/li&gt;&lt;li&gt;Ook zonder analyse of bij een fout is duidelijk wat er gebeurt.&lt;/li&gt;&lt;/ul&gt;${b(&#x27;Bespreek dit onderdeel&#x27;,&#x27;discuss-overview&#x27;)}`);}
function approval(){if(s.stage===&#x27;draft&#x27;)return callout(&#x27;Klaar om functioneel goed te keuren?&#x27;,&#x27;Je keurt de werking en schermen goed. Robbert beoordeelt daarna het voorgestelde AI-gebruik.&#x27;,b(&#x27;Functioneel akkoord&#x27;,&#x27;po-approve&#x27;,true),&#x27;green&#x27;);if(s.stage===&#x27;review&#x27;&amp;&amp;s.adjusted&amp;&amp;!s.poApproved)return callout(&#x27;Versie 3 · één functionele wijziging&#x27;,&#x27;AI analyseert alleen nieuwe of gewijzigde stukken. Ongewijzigde stukken worden niet elke tien minuten opnieuw geanalyseerd.&#x27;,b(&#x27;Akkoord met versie 3&#x27;,&#x27;po-reapprove&#x27;,true),&#x27;blue&#x27;);if(s.stage===&#x27;review&#x27;)return callout(&#x27;Wacht op de architect&#x27;,&#x27;Jouw akkoord staat vast voor deze versie. Robbert beoordeelt de AI-frequentie; daarna kan de planning starten.&#x27;,b(&#x27;Bekijk wat er openstaat&#x27;,&#x27;reviews&#x27;),&#x27;blue&#x27;);return &#x27;&#x27;;}
function ux(){return panel(&#x27;Schermontwerp · aandachtspunten&#x27;,`&lt;div class=&quot;pf-ux-toolbar&quot;&gt;&lt;div&gt;${[[&#x27;main&#x27;,&#x27;Overzicht&#x27;],[&#x27;detail&#x27;,&#x27;Detail&#x27;],[&#x27;empty&#x27;,&#x27;Leeg&#x27;],[&#x27;error&#x27;,&#x27;Fout&#x27;]].map(([k,l])=&gt;b(l,&#x27;ux-&#x27;+k,false,`aria-pressed=&quot;${s.ux===k}&quot;`)).join(&#x27;&#x27;)}&lt;/div&gt;${b(s.mobile?&#x27;Bekijk desktop&#x27;:&#x27;Bekijk mobiel&#x27;,&#x27;viewport&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv-window ${s.mobile?&#x27;mobile&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;pv-bar&quot;&gt;&lt;span&gt;PvdD · Raadswerk&lt;/span&gt;&lt;span&gt;Marc&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pv-body&quot;&gt;&lt;div class=&quot;pf-small pf-muted&quot;&gt;Gemeenteraad · 24 september&lt;/div&gt;&lt;div class=&quot;pv-title&quot;&gt;${s.ux===&#x27;detail&#x27;?&#x27;Groen in de openbare ruimte&#x27;:&#x27;Aandachtspunten&#x27;}&lt;/div&gt;&lt;p class=&quot;pf-small pf-muted&quot;&gt;${s.ux===&#x27;detail&#x27;?&#x27;Agendapunt 7 · nieuw stuk beschikbaar&#x27;:&#x27;Bereid je vergadering gericht voor.&#x27;}&lt;/p&gt;${s.ux===&#x27;empty&#x27;?&#x27;&lt;div class=&quot;pf-callout green&quot;&gt;&lt;div&gt;&lt;strong&gt;Je bent bij&lt;/strong&gt;&lt;p&gt;Er zijn geen nieuwe aandachtspunten. Alle agendapunten blijven beschikbaar.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&#x27;:s.ux===&#x27;error&#x27;?&#x27;&lt;div class=&quot;pf-callout&quot;&gt;&lt;div&gt;&lt;strong&gt;Analyse nog niet beschikbaar&lt;/strong&gt;&lt;p&gt;De bronstukken kun je al lezen. We proberen de analyse opnieuw.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&#x27;:s.ux===&#x27;detail&#x27;?`&lt;div class=&quot;pv-disclaimer&quot;&gt;AI-concept · controleer bronnen en formulering&lt;/div&gt;&lt;h3 style=&quot;margin-top:18px&quot;&gt;Waarom dit aandacht vraagt&lt;/h3&gt;&lt;p&gt;In het gewijzigde voorstel is minder ruimte voor groen opgenomen. Vergelijk de nieuwe bijlage met het oorspronkelijke voors &lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
