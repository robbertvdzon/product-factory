spring:
  application:
    name: product-factory
  datasource:
    url: ${PF_DB_URL}
    username: ${PF_DB_USERNAME}
    password: ${PF_DB_PASSWORD}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${PF_RUNTIME_PORT:8080}
product-factory:
  agent-bridge:
    base-url: ${PF_AGENT_BRIDGE_BASE_URL:http://localhost:8081}
    poll-interval: ${PF_AGENT_BRIDGE_POLL_INTERVAL:PT2S}
  workspace:
    path: ${PF_WORKSPACE_PATH}
    repository: ${PF_WORKSPACE_REPOSITORY}
    main-branch: ${PF_WORKSPACE_MAIN_BRANCH:main}
    remote-publication: ${PF_WORKSPACE_REMOTE_PUBLICATION:false}
  software-factory:
    base-url: ${PF_SOFTWARE_FACTORY_BASE_URL:http://localhost:9090}
    token: ${PF_SOFTWARE_FACTORY_TOKEN:}
  autonomy:
    enabled: ${PF_AUTONOMY_ENABLED:false}
    poll-delay: ${PF_AUTONOMY_POLL_DELAY:PT1M}
  iteration:
    orphan-reconcile-delay: ${PF_ORPHAN_RECONCILE_DELAY:PT10M}
