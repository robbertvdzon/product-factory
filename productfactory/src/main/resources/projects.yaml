# Vaste projectgegevens: GitHub-repo, acceptatieomgeving en admin-URL per product (adminUrl is optioneel).
# Wordt bij het opstarten toegepast op reeds bestaande producten (nl.vdzon.productfactory.product.ProjectsYamlReconciler).
# Alles wat via het dashboard wijzigt (status, cyclustijden, AI-instellingen) staat alleen in de database.
# Een slug die hier nog niet als product bestaat, wordt overgeslagen totdat die via de API is aangemaakt.
products:
  - slug: product-factory
    targetRepositoryName: robbertvdzon/product-factory
    acceptanceUrl: https://product-factory-acceptance.vdzonsoftware.nl
  - slug: hkh-autopilot
    targetRepositoryName: robbertvdzon/hkh-autopilot
    acceptanceUrl: https://hkh-autopilot-acceptance.vdzonsoftware.nl
