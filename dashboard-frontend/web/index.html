<!DOCTYPE html><html><head><base href="$FLUTTER_BASE_HREF"><meta charset="UTF-8"><meta content="IE=Edge" http-equiv="X-UA-Compatible"><meta name="description" content="Product Factory dashboard"><meta name="mobile-web-app-capable" content="yes"><title>Product Factory</title></head><body><script>
  // Browsers checken een al geregistreerde service worker vanzelf hooguit eens per 24 uur op
  // updates, ongeacht Cache-Control op het script zelf. Forceer daarom bij elke paginalaad een
  // directe check, zodat een nieuwe deploy nooit tot 24 uur op een oude cache kan blijven hangen.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((registrations) => {
      registrations.forEach((registration) => registration.update());
    });
  }
</script><script src="flutter_bootstrap.js" async></script></body></html>
