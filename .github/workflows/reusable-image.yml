name: Reusable JVM image
on:
  workflow_call:
    inputs:
      image: {required: true, type: string}
      context: {required: true, type: string}
      dockerfile: {required: true, type: string}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ghcr.io/robbertvdzon/${{ inputs.image }}:main,ghcr.io/robbertvdzon/${{ inputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
