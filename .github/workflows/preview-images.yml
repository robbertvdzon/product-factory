name: Build isolated PR preview images
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to build (also supports legacy PRs with merge conflicts)
        required: true
        type: string
permissions: {}
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      pr: ${{ steps.resolve.outputs.pr }}
      matrix: ${{ steps.layout.outputs.matrix }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" > /tmp/pr.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.state == "open" and .head.repo.full_name == $repo' /tmp/pr.json
          echo "sha=$(jq -r .head.sha /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          persist-credentials: false
      - id: layout
        run: |
          if test -f productfactory/Dockerfile; then
            echo 'matrix={"include":[{"image":"product-factory-runtime","file":"productfactory/Dockerfile","context":"."},{"image":"product-factory-dashboard-backend","file":"dashboard-backend/Dockerfile","context":"."},{"image":"product-factory-dashboard-frontend","file":"dashboard-frontend/Dockerfile","context":"dashboard-frontend"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"image":"product-factory-backend","file":"product-factory-app/Dockerfile","context":"."},{"image":"product-factory-frontend","file":"product-factory-frontend/Dockerfile","context":"."}]}' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ needs.resolve.outputs.sha }}
          build-args: |
            SOURCE_REVISION=${{ needs.resolve.outputs.sha }}
            API_BASE_URL=https://product-factory-api-pr-${{ needs.resolve.outputs.pr }}.vdzonsoftware.nl
            GOOGLE_CLIENT_ID=
            AUTH_REQUIRED=false
          cache-from: type=gha,scope=preview-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.image }}
