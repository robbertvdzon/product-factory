version: 1
commands:
  - id: repository-maven-verify
    pathPrefixes: [productfactory-contracts/, productfactory-common/, productfactory/, agentworker/, dashboard-backend/, pom.xml, Dockerfile.agent, .factory/verification.yaml]
    argv: [mvn, -B, --no-transfer-progress, clean, verify]
    workingDirectory: .
    timeoutSeconds: 1800
  - id: dashboard-flutter-analyze
    pathPrefixes: [dashboard-frontend/]
    argv: [flutter, analyze]
    workingDirectory: dashboard-frontend
    timeoutSeconds: 900
  - id: dashboard-flutter-test
    pathPrefixes: [dashboard-frontend/]
    argv: [flutter, test]
    workingDirectory: dashboard-frontend
    timeoutSeconds: 900
  # De frontend-image wordt op elke PR en op main gebouwd (.github/workflows/images.yml) en is het
  # enige pad waar pubspec.lock tegen de gepinde Flutter-base wordt opgelost. Zonder deze entry viel
  # die build buiten het vangnet.
  - id: dashboard-frontend-image-build
    agentRunnable: false
    pathPrefixes: [dashboard-frontend/]
    argv: [docker, build, -f, dashboard-frontend/Dockerfile, dashboard-frontend]
    workingDirectory: .
    timeoutSeconds: 1800
  - id: agent-image-build
    agentRunnable: false
    pathPrefixes: [Dockerfile.agent, agentworker/, productfactory-common/, productfactory-contracts/, pom.xml]
    argv: [docker, build, --target, build, -f, Dockerfile.agent, .]
    workingDirectory: .
    timeoutSeconds: 1800
