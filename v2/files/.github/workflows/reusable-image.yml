name: Reusable JVM image
on:
  workflow_call:
    inputs:
      image: {required: true, type: string}
      context: {required: true, type: string}
      dockerfile: {required: true, type: string}
      # ref/sha laten callers een PR-headcommit bouwen (github.sha is bij pull_request-events de
      # synthetische mergecommit, niet de echte headcommit die de ArgoCD-preview-ApplicationSet
      # later via {{.head_sha}} verwacht). main_tag laat een PR-build de mutable :main-tag overslaan
      # zonder een aparte conditional-tags-constructie: bij een PR geeft de caller hier gewoon
      # dezelfde sha-tag door, zodat er feitelijk maar één tag verschijnt.
      ref: {required: false, type: string, default: ''}
      sha: {required: false, type: string, default: ''}
      main_tag: {required: false, type: string, default: main}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.ref || github.sha }}'}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/robbertvdzon/${{ inputs.image }}:sha-${{ inputs.sha || github.sha }}
            ghcr.io/robbertvdzon/${{ inputs.image }}:${{ inputs.main_tag }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
