name: Repository verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-factory-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      jvm: ${{ steps.filter.outputs.jvm }}
      frontend: ${{ steps.filter.outputs.frontend }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            jvm:
              - 'pom.xml'
              - 'productfactory-contracts/**'
              - 'productfactory-common/**'
              - 'productfactory/**'
              - 'agentworker/**'
              - 'dashboard-backend/**'
            frontend:
              - 'dashboard-frontend/**'
            agent:
              - 'pom.xml'
              - 'productfactory-contracts/**'
              - 'productfactory-common/**'
              - 'agentworker/**'
              - 'Dockerfile.agent'
  backend:
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B --no-transfer-progress verify
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.6', cache: true}
      - working-directory: dashboard-frontend
        run: flutter pub get && flutter analyze && flutter test && flutter build web --release --dart-define=AUTH_REQUIRED=false
  agent-image:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target build -f Dockerfile.agent .
  repository-verification:
    name: Repository verification
    if: always()
    needs: [changes, backend, frontend, agent-image]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed for required components
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          AGENT: ${{ needs.agent-image.result }}
        run: |
          test "$CHANGES" = success
          for result in "$BACKEND" "$FRONTEND" "$AGENT"; do
            test "$result" = success || test "$result" = skipped
          done
