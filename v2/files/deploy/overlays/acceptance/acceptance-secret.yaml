# Gecommit (niet-sealed) secret met vaste, niet-productiewaarden. Bevat geen echte credentials, zelfde
# aanpak als deploy/overlays/preview/preview-secret.yaml. Deze omgeving is standing (niet PR-gebonden),
# dus PF_PREVIEW_PR_NUMBER blijft leeg — PreviewRuntimeConfig accepteert dat expliciet voor de
# acceptance-marker (zie productfactory/.../preview/PreviewRuntimeConfig.kt).
apiVersion: v1
kind: Secret
metadata:
  name: product-factory-secrets
  labels:
    preview.vdzonsoftware.nl/data-class: disposable
type: Opaque
stringData:
  PF_DB_PASSWORD: productfactory-acceptance-only
  PF_ADMIN_EMAILS: ""
  PF_GOOGLE_CLIENT_ID: ""
  PF_SOFTWARE_FACTORY_TOKEN: ""
  PF_AGENT_WORKER_TOKEN: ""
  PF_DASHBOARD_AUTH_REQUIRED: "false"
  PF_WORKSPACE_REMOTE_PUBLICATION: "false"
  PF_AUTONOMY_ENABLED: "false"
  PF_PREVIEW_ENABLED: "true"
  PF_PREVIEW_MARKER: product-factory-acceptance
  SPRING_PROFILES_ACTIVE: mock-agent-bridge
