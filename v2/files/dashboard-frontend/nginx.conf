server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Oude Flutter service workers kunnen een verouderde app-shell blijven tonen. Deze
    # kill-switch wist hun caches, registreert ze af en herlaadt openstaande tabs één keer.
    location = /flutter_service_worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 "self.addEventListener('install',function(){self.skipWaiting();});self.addEventListener('activate',function(e){e.waitUntil((async function(){try{var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k);}));await self.registration.unregister();var cs=await self.clients.matchAll();cs.forEach(function(c){c.navigate(c.url);});}catch(err){}})());});";
    }

    # Alleen de content-gehashte JavaScript-bundle is immutable: iedere build krijgt een
    # nieuwe URL. Vaste Flutter-bestandsnamen moeten altijd opnieuw gevalideerd worden.
    location ~* ^/main\.[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
