spring:
  datasource:
    url: jdbc:h2:mem:product-factory-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    locations: classpath:db/migration

# Retentie wordt in tests expliciet via ProcessHistoryRetention.prune(now) getest; de gedeelde H2-database
# mag niet halverwege een test door een geplande run van een andere (gecachete) testcontext worden opgeschoond.
PF_HISTORY_RETENTION_ENABLED: false
