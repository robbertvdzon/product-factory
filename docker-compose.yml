services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: productfactory_v2
      POSTGRES_USER: productfactory_v2
      POSTGRES_PASSWORD: ${PF_DB_PASSWORD:?PF_DB_PASSWORD ontbreekt}
    ports: ["5436:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productfactory_v2 -d productfactory_v2"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - product-factory-postgres-v2:/var/lib/postgresql/data

  backend:
    image: eclipse-temurin:21-jre-jammy
    command: ["java", "-jar", "/opt/product-factory/product-factory-app.jar"]
    environment:
      PF_ENVIRONMENT: local
      PF_DB_URL: jdbc:postgresql://postgres:5432/productfactory_v2
      PF_DB_USERNAME: productfactory_v2
      PF_DB_PASSWORD: ${PF_DB_PASSWORD:?PF_DB_PASSWORD ontbreekt}
    ports: ["8080:8080"]
    volumes:
      - ./product-factory-app/target/product-factory-app-0.1.0-SNAPSHOT.jar:/opt/product-factory/product-factory-app.jar:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: nginx:1.28.0-alpine
    ports: ["8082:8080"]
    volumes:
      - ./product-factory-frontend/build/web:/usr/share/nginx/html:ro
      - ./product-factory-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]

volumes:
  product-factory-postgres-v2:
