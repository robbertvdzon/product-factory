services:
  backend:
    image: eclipse-temurin:21-jre-jammy
    command: ["java", "-jar", "/opt/product-factory/product-factory-app.jar"]
    environment:
      PF_ENVIRONMENT: local
    ports: ["8080:8080"]
    volumes:
      - ./product-factory-app/target/product-factory-app-0.1.0-SNAPSHOT.jar:/opt/product-factory/product-factory-app.jar:ro

  frontend:
    image: nginx:1.28.0-alpine
    ports: ["8082:8080"]
    volumes:
      - ./product-factory-frontend/build/web:/usr/share/nginx/html:ro
      - ./product-factory-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
