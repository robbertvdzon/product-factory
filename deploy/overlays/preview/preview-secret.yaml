# Gecommit (niet-sealed) secret met vaste, niet-productiewaarden. Bevat geen echte credentials:
# de workspace-repository (product-factory-workspace) is publiek, dus er is geen Git-token nodig
# zolang PF_WORKSPACE_REMOTE_PUBLICATION op "false" staat. PF_PREVIEW_PR_NUMBER wordt niet hier maar
# per PR via de ArgoCD ApplicationSet-patch op de runtime-Deployment gezet (zie
# ~/robberts-infrastructure/manifests/root-app/apps/product-factory-applicationset.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: product-factory-secrets
  labels:
    preview.vdzonsoftware.nl/data-class: disposable
type: Opaque
stringData:
  PF_DB_PASSWORD: productfactory-preview-only
  PF_ADMIN_EMAILS: ""
  PF_GOOGLE_CLIENT_ID: ""
  PF_SOFTWARE_FACTORY_TOKEN: ""
  PF_AGENT_WORKER_TOKEN: ""
  PF_DASHBOARD_AUTH_REQUIRED: "false"
  PF_WORKSPACE_REMOTE_PUBLICATION: "false"
  PF_AUTONOMY_ENABLED: "false"
  PF_PREVIEW_ENABLED: "true"
  PF_PREVIEW_MARKER: product-factory-pr-preview
  SPRING_PROFILES_ACTIVE: mock-agent-bridge
