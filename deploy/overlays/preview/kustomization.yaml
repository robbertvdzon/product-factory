apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - preview-secret.yaml
patches:
  # De SealedSecret is versleuteld voor de productienamespace en kan niet door een per-PR-namespace
  # ontsleuteld worden. previewsecret.yaml levert dezelfde secretnaam met vaste, niet-gevoelige
  # wegwerpwaarden.
  - target:
      group: bitnami.com
      version: v1alpha1
      kind: SealedSecret
      name: product-factory-secrets
    patch: |-
      $patch: delete
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: product-factory-secrets
  # Previewdatabases zijn wegwerpbaar en klein; 5Gi op de productie-PVC is overkill per PR.
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  # NodePort is cluster-breed uniek: de vaste nodePort 30432 uit de productie-Service zou botsen
  # zodra een tweede PR-omgeving tegelijk draait. Previewdatabases zijn alleen in-cluster nodig.
  - target:
      version: v1
      kind: Service
      name: postgres
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  # De runtime-Route staat in productie bewust op Redirect omdat hij daar nooit rechtstreeks
  # bezocht wordt. In preview moet een tester het mock-agent-bridge-endpoint wel kunnen aanroepen;
  # Redirect veroorzaakt daar een oneindige HTTPS-redirect-loop omdat Cloudflare de router
  # cluster-intern altijd via HTTP benadert (wildcard-routing). Allow
  # (zoals de andere twee Routes al gebruiken) lost dat op.
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: runtime
    patch: |-
      - op: replace
        path: /spec/tls/insecureEdgeTerminationPolicy
        value: Allow
