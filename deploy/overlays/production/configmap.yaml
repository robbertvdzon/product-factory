apiVersion: v1
kind: ConfigMap
metadata:
  name: product-factory-config
data:
  PF_ENVIRONMENT: production
  PF_AUTH_REQUIRED: "true"
  PF_PUBLIC_FRONTEND_URL: https://product-factory.vdzonsoftware.nl
  PF_PUBLIC_BACKEND_URL: https://product-factory-api.vdzonsoftware.nl
  PF_DB_URL: jdbc:postgresql://product-factory-postgres:5432/productfactory_v2
  PF_DB_USERNAME: productfactory_v2
  PF_SCHEDULES_ENABLED: "true"
  PF_AI_VENDOR_ID: openai
  PF_AI_MODEL: gpt-5.6-sol
  PF_AI_EXECUTION_MODE: SUBSCRIPTION
  PF_AGENT_RUNTIME_API_VERSION: v2
  PF_SOFTWARE_FACTORY_MODE: REAL
  PF_SOFTWARE_FACTORY_URL: http://softwarefactory-dashboard-backend.software-factory.svc.cluster.local/api/integrations/v2
  PF_SOFTWARE_FACTORY_DASHBOARD_URL: http://softwarefactory-dashboard-backend.software-factory.svc.cluster.local
  PF_SOFTWARE_FACTORY_HOTFIX_ENABLED: "false"
  PF_EXTERNAL_MUTATIONS_ALLOWED: "false"
  PF_AGENT_RUNTIME_URL: http://agent-runtime-server.agent-runtime.svc.cluster.local
  PF_AI_RUNTIME_SCHEDULING_ENABLED: "true"
