apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-factory-acceptance
resources:
  - ../../base
  - acceptance-secret.yaml
patches:
  # De SealedSecret is versleuteld voor de productienamespace en kan niet door de acceptance-namespace
  # ontsleuteld worden. acceptance-secret.yaml levert dezelfde secretnaam met vaste, niet-gevoelige
  # wegwerpwaarden. Zelfde aanpak als deploy/overlays/preview/kustomization.yaml.
  - target:
      group: bitnami.com
      version: v1alpha1
      kind: SealedSecret
      name: product-factory-secrets
    patch: |-
      $patch: delete
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: product-factory-secrets
  # De acceptatieomgeving is een standing, niet-wegwerpbare omgeving, maar heeft geen productieverkeer;
  # 1Gi is ruim voldoende voor de geseede demodata.
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target:
      version: v1
      kind: Service
      name: postgres
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  # Vaste hostnamen voor de standing acceptatieomgeving (geen ArgoCD-templating nodig, er is maar één
  # instantie).
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: dashboard-frontend
    patch: |-
      - op: replace
        path: /spec/host
        value: product-factory-acceptance.vdzonsoftware.nl
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: dashboard-backend
    patch: |-
      - op: replace
        path: /spec/host
        value: product-factory-api-acceptance.vdzonsoftware.nl
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: runtime
    patch: |-
      - op: replace
        path: /spec/host
        value: product-factory-runtime-acceptance.vdzonsoftware.nl
      # Zelfde reden als preview: een onderzoeker moet het mock-agent-bridge-controle-endpoint kunnen
      # aanroepen; Redirect veroorzaakt een oneindige HTTPS-redirect-loop omdat Cloudflare de router
      # cluster-intern altijd via HTTP benadert.
      - op: replace
        path: /spec/tls/insecureEdgeTerminationPolicy
        value: Allow
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: dashboard-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: PF_DASHBOARD_ORIGIN
            value: 'https://product-factory-acceptance.vdzonsoftware.nl'
