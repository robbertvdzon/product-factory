apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime
  namespace: product-factory
spec:
  replicas: 1
  selector:
    matchLabels: {app: runtime}
  template:
    metadata:
      labels: {app: runtime}
    spec:
      initContainers:
        - name: workspace-checkout
          image: alpine/git:2.49.1
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              if [ -d /workspace/.git ]; then
                echo "Workspace is already initialized"
              else
                git clone "$PF_WORKSPACE_REPOSITORY" /workspace
              fi
          envFrom:
            - configMapRef: {name: product-factory-config}
          volumeMounts: [{name: workspace, mountPath: /workspace}]
      containers:
        - name: runtime
          image: ghcr.io/robbertvdzon/product-factory-runtime:sha-6308b02572cdd6cb0748cf785017c43f4932563b
          imagePullPolicy: Always
          envFrom:
            - configMapRef: {name: product-factory-config}
            - secretRef: {name: product-factory-secrets}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          volumeMounts: [{name: workspace, mountPath: /workspace}]
      volumes: [{name: workspace, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: runtime
  namespace: product-factory
spec:
  selector: {app: runtime}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: runtime
  namespace: product-factory
spec:
  host: product-factory-runtime.apps.sno.vdzonsoftware.nl
  to: {kind: Service, name: runtime}
  port: {targetPort: 8080}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
