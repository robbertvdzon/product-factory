# Container memory includes heap, metaspace, stacks and native buffers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-factory-backend
spec:
  template:
    spec:
      containers:
      - name: backend
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 640Mi
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -Xmx320m -XX:+UseSerialGC
