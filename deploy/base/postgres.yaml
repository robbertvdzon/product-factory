apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: product-factory
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: product-factory
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_DB, value: productfactory}
            - {name: POSTGRES_USER, value: productfactory}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: product-factory-secrets, key: PF_DB_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, productfactory]}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: product-factory
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
