apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: product-factory
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          # SCLOrg images are prepared for OpenShift's arbitrary runtime UID.
          image: quay.io/sclorg/postgresql-16-c9s:latest
          env:
            - {name: POSTGRESQL_DATABASE, value: productfactory}
            - {name: POSTGRESQL_USER, value: productfactory}
            - name: POSTGRESQL_PASSWORD
              valueFrom: {secretKeyRef: {name: product-factory-secrets, key: PF_DB_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, productfactory]}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/pgsql/data}]
      # The SNO local-path provisioner does not relabel PVCs for OpenShift SELinux.
      # Match the HKH phase-1 deployments with disposable storage until a
      # production-grade PostgreSQL service or compatible StorageClass is chosen.
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: product-factory
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
