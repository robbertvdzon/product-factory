apiVersion: batch/v1
kind: CronJob
metadata:
  name: product-factory-database-backup
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: product-factory-database-backup
          restartPolicy: Never
          securityContext:
            fsGroupChangePolicy: OnRootMismatch
            seLinuxOptions:
              type: spc_t
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: quay.io/sclorg/postgresql-16-c9s@sha256:22162c54bc5a00ac54c5d48da193a8a3805e10950b961b36aa121ea6b11ea6ae
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                runAsNonRoot: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  umask 077
                  backup_dir=/backups/productfactory-v2
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  final="$backup_dir/product-factory-$timestamp.dump"
                  temporary="$backup_dir/.product-factory-$timestamp.dump.tmp"
                  checksum_temporary="$temporary.sha256"
                  trap 'rm -f "$temporary" "$checksum_temporary"' EXIT
                  mkdir -p "$backup_dir"
                  pg_dump --format=custom --no-owner --no-privileges --file "$temporary"
                  pg_restore --list "$temporary" >/dev/null
                  digest="$(sha256sum "$temporary" | awk '{print $1}')"
                  printf '%s  %s\n' "$digest" "$(basename "$final")" > "$checksum_temporary"
                  mv "$temporary" "$final"
                  mv "$checksum_temporary" "$final.sha256"
                  find "$backup_dir" -type f -mtime +14 -name 'product-factory-*.dump*' -delete
              env:
                - name: PGHOST
                  value: product-factory-postgres
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: productfactory_v2
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef:
                      name: product-factory-config
                      key: PF_DB_USERNAME
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: product-factory-secrets
                      key: PF_DB_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: product-factory-v2-backups
