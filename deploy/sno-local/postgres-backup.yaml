apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  namespace: product-factory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup-host-scc
  namespace: product-factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:postgresql-host-backup
subjects:
  - kind: ServiceAccount
    name: postgres-backup
    namespace: product-factory
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: product-factory
spec:
  schedule: "45 2 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: OnFailure
          securityContext:
            seLinuxOptions: {type: spc_t}
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: quay.io/sclorg/postgresql-16-c9s:latest
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -ec
                - |
                  umask 077
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  filename="product-factory-${timestamp}.dump"
                  temporary="/backups/.${filename}.tmp"
                  final="/backups/${filename}"
                  pg_dump --format=custom --compress=6 --file="${temporary}"
                  pg_restore --list "${temporary}" >/dev/null
                  mv "${temporary}" "${final}"
                  sha256sum "${final}" > "${final}.sha256"
                  find /backups -type f \( -name 'product-factory-*.dump' -o -name 'product-factory-*.dump.sha256' \) -mtime +30 -delete
              env:
                - {name: PGHOST, value: postgres}
                - {name: PGDATABASE, value: productfactory}
                - {name: PGUSER, value: productfactory}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: product-factory-secrets, key: PF_DB_PASSWORD}}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                runAsNonRoot: true
                runAsUser: 1000
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 500m, memory: 512Mi}
              volumeMounts:
                - {name: backups, mountPath: /backups}
          volumes:
            - name: backups
              hostPath:
                path: /var/mnt/external-hdd/postgres-backups/product-factory
                type: DirectoryOrCreate
